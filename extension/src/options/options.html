<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Recall Capture — Settings</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #f8fafc;
        margin-bottom: 4px;
      }
      p.sub {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 24px;
      }
      section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 4px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 8px;
      }
      input[type="text"], input[type="url"], select {
        width: 100%;
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 4px;
        padding: 8px 10px;
        font-size: 13px;
        box-sizing: border-box;
      }
      input[type="text"]:focus, input[type="url"]:focus, select:focus {
        outline: none;
        border-color: #38bdf8;
      }
      .kind-row {
        display: grid;
        grid-template-columns: 110px 1fr 110px 110px 70px;
        gap: 10px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #334155;
      }
      .kind-row:last-child { border-bottom: none; }
      .kind-name { font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 12px; color: #f8fafc; }
      .error { color: #fda4af; font-size: 11px; min-height: 14px; margin-top: 2px; }
      button {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        padding: 8px 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.15s ease;
      }
      .save-all { background: #38bdf8; color: #0f172a; }
      .save-all:hover { background: #0ea5e9; }
      .status { margin-left: 12px; font-size: 12px; color: #94a3b8; font-weight: 600; }
      input[type="color"] {
        width: 100%;
        height: 32px;
        border: 1px solid #334155;
        background: none;
        padding: 2px;
        border-radius: 4px;
        cursor: pointer;
      }
      input[type="checkbox"] {
        accent-color: #38bdf8;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Recall Capture — Settings</h1>
      <p class="sub">Configure per-kind hotkeys, timeline markers, and the Recall server base URL.</p>

      <section>
        <label for="baseUrl">Recall base URL</label>
        <input id="baseUrl" type="url" placeholder="http://localhost:3000" />
      </section>

      <section>
        <div class="kind-row" style="font-size:11px;opacity:.6;border-bottom:1px solid #333;">
          <div>Kind</div>
          <div>Shortcut</div>
          <div>Shape</div>
          <div>Color</div>
          <div>Visible</div>
        </div>
        <div id="kinds"></div>
      </section>

      <button id="saveAll" class="save-all">Save settings</button>
      <span id="status" class="status"></span>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
