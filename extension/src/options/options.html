<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Recall Capture — Settings</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Roboto, Arial, sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      h1 { font-size: 20px; margin-bottom: 4px; }
      p.sub { opacity: .7; font-size: 13px; margin-top: 0; }
      section {
        background: #1b1b1b;
        border: 1px solid #2c2c2c;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      label { display: block; font-size: 12px; opacity: .8; margin-bottom: 4px; }
      input[type="text"], input[type="url"] {
        width: 100%;
        background: #2b2b2b;
        color: #f1f1f1;
        border: 1px solid #3f3f3f;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .kind-row {
        display: grid;
        grid-template-columns: 90px 1fr 90px 90px 70px;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #262626;
      }
      .kind-row:last-child { border-bottom: none; }
      .kind-name { font-weight: 600; text-transform: capitalize; }
      .error { color: #ff6b6b; font-size: 11px; min-height: 14px; }
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      .save-all { background: #3ea6ff; color: #000; }
      .status { margin-left: 12px; font-size: 12px; opacity: .8; }
      input[type="color"] { width: 100%; height: 32px; border: none; background: none; padding: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recall Capture — Settings</h1>
      <p class="sub">Configure per-kind hotkeys, timeline markers, and the Recall server base URL.</p>

      <section>
        <label for="baseUrl">Recall base URL</label>
        <input id="baseUrl" type="url" placeholder="http://localhost:3000" />
      </section>

      <section>
        <div class="kind-row" style="font-size:11px;opacity:.6;border-bottom:1px solid #333;">
          <div>Kind</div>
          <div>Shortcut</div>
          <div>Shape</div>
          <div>Color</div>
          <div>Visible</div>
        </div>
        <div id="kinds"></div>
      </section>

      <button id="saveAll" class="save-all">Save settings</button>
      <span id="status" class="status"></span>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
