<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Recall Capture</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #181818;
        color: #EBDCC4;
      }
      main { padding: 18px; }
      h1 {
        font-size: 11px;
        font-weight: 700;
        margin: 0 0 14px;
        color: #B6A596;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #kinds {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .kind-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: #181818;
        border: 1px solid #4A4441;
        border-radius: 4px;
        transition: all 0.15s ease;
      }
      .kind-row:hover {
        border-color: #DC9F85;
      }
      .kind-info {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .kind-name {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #EBDCC4;
      }
      .kind-desc {
        font-size: 10px;
        color: #B6A596;
        margin-top: 2px;
      }
      .capture-btn {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 10px;
        font-weight: 700;
        background: #DC9F85;
        color: #181818;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.15s ease;
      }
      .capture-btn:hover { background: #EBDCC4; }
      .toggle-label {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }
      .toggle-label input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #181818;
        border: 1px solid #4A4441;
        transition: .2s;
        border-radius: 4px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: #B6A596;
        transition: .2s;
        border-radius: 2px;
      }
      input:checked + .slider {
        background-color: #181818;
        border-color: #DC9F85;
      }
      input:checked + .slider:before {
        transform: translateX(16px);
        background-color: #DC9F85;
      }
      .actions { display: flex; gap: 8px; margin-top: 18px; border-top: 1px solid #4A4441; padding-top: 14px; }
      .actions button {
        flex: 1;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.15s ease;
      }
      .open-recall { background: #DC9F85; color: #181818; }
      .open-recall:hover { background: #EBDCC4; }
      .settings { background: #181818; color: #EBDCC4; border: 1px solid #4A4441; }
      .settings:hover { background: #2e2927; }
    </style>
  </head>
  <body>
    <main>
      <h1>Capture Card / Show Markers</h1>
      <div id="kinds"></div>
      <div class="actions">
        <button id="openRecall" class="open-recall" type="button">Open Dashboard</button>
        <button id="openSettings" class="settings" type="button">Settings</button>
      </div>
      <button id="attemptVideo" class="attempt-video" type="button" style="background:#181818; color:#EBDCC4; border:1px solid #DC9F85; display:none; margin-top:8px; width:100%; cursor:pointer; border-radius:4px; padding:8px 12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; text-align:center; transition:all 0.15s ease;">Attempt Video Questions</button>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
